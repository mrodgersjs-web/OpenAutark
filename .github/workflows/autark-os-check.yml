name: autark-os checks

on:
  push:
    paths: ["autark-os/**", "research/what-great-looks-like/**", ".github/workflows/autark-os-check.yml"]
  pull_request:
    paths: ["autark-os/**", "research/what-great-looks-like/**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  layer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Layer checks (layout, agents, skills, router, docs, install)
        run: sh autark-os/scripts/check.sh all
      - name: No edits under apps/
        run: |
          if git diff --name-only origin/main...HEAD -- apps | grep -q .; then
            echo "autark-os must not modify upstream app code"; exit 1
          fi
